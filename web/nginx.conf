# API gateway + static UI. The only container with a published port.
# Routes /api/<service>/* to the private services (prefix stripped), streams SSE unbuffered,
# rate-limits run creation, and serves the React app with an SPA fallback.

map $request_method $run_create_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $run_create_key zone=run_create:10m rate=6r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    server_tokens off;

    # Docker's embedded DNS; variables in proxy_pass make nginx start even if a backend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/markdown;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Creating runs costs LLM tokens: at most 6 per minute per client (burst 3).
    location = /api/orchestrator/v1/runs {
        limit_req zone=run_create burst=3 nodelay;
        limit_req_status 429;
        set $orchestrator http://orchestrator-api:8000;
        rewrite ^/api/orchestrator/(.*)$ /$1 break;
        proxy_pass $orchestrator;
    }

    location /api/orchestrator/ {
        set $orchestrator http://orchestrator-api:8000;
        rewrite ^/api/orchestrator/(.*)$ /$1 break;
        proxy_pass $orchestrator;
        # Server-Sent Events: never buffer, keep the connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/memory/ {
        set $memory http://memory:8004;
        rewrite ^/api/memory/(.*)$ /$1 break;
        proxy_pass $memory;
    }

    location /api/evaluator/ {
        set $evaluator http://evaluator:8002;
        rewrite ^/api/evaluator/(.*)$ /$1 break;
        proxy_pass $evaluator;
    }

    location /api/knowledge/ {
        set $knowledge http://knowledge:8003;
        rewrite ^/api/knowledge/(.*)$ /$1 break;
        proxy_pass $knowledge;
    }

    # The generator is internal-only: no route on purpose. Unknown API paths get a JSON 404
    # instead of falling through to the SPA's index.html.
    location /api/ {
        default_type application/json;
        return 404 '{"detail":"unknown API route"}';
    }

    location /assets/ {
        expires 1y;
        access_log off;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
