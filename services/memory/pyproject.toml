[project]
name = "lessongen-memory"
version = "0.1.0"
description = "Memory service: long-term memory (runs, rejection logs, guidelines, feedback, rubric versions) and consolidation."
requires-python = ">=3.13,<3.14"
dependencies = [
    "lessongen-common[service,llm]",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.16",
]

[tool.uv.sources]
lessongen-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_svc"]
