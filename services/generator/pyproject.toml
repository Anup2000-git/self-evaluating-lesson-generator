[project]
name = "lessongen-generator"
version = "0.1.0"
description = "Generator service: lesson planner and ReAct writer agent (create and revise)."
requires-python = ">=3.13,<3.14"
dependencies = ["lessongen-common[service,llm,text]"]

[tool.uv.sources]
lessongen-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator_svc"]
