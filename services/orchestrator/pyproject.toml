[project]
name = "lessongen-orchestrator"
version = "0.1.0"
description = "Orchestrator: owns the generate -> evaluate -> regenerate LangGraph pipeline (API + worker)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "lessongen-common[service,llm]",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    "sse-starlette>=2.2",
]

[tool.uv.sources]
lessongen-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_svc"]
