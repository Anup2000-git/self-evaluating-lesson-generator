# Held-out assessment for rubric check COV-5. Never shown to the writer.
learner_questions:
  - id: Q1
    question: What does RAG stand for?
    reference_answer: Retrieval-Augmented Generation.
  - id: Q2
    question: Why might an LLM give an outdated or wrong answer about something that happened recently?
    reference_answer: >-
      Because it only knows information from its training data up to its knowledge cutoff
      date. It learned nothing after that, so it may guess or give old information.
  - id: Q3
    question: In RAG, what happens before the LLM writes its answer?
    reference_answer: >-
      The system retrieves (searches for and finds) relevant pieces of information from a
      knowledge base and adds them to the prompt together with the question.
  - id: Q4
    question: >-
      Put these steps in the right order - generate the answer; add the found information to
      the prompt; find relevant information.
    reference_answer: >-
      Find relevant information (retrieve), then add it to the prompt (augment), then
      generate the answer.
  - id: Q5
    question: Does RAG permanently change or retrain the LLM? Explain.
    reference_answer: >-
      No. RAG only gives the LLM extra information for that particular question; the model
      itself is not changed (changing the model would be fine-tuning).
  - id: Q6
    question: Give one real-life example where RAG is useful.
    reference_answer: >-
      Any valid situation where an AI answers using specific documents it was not trained on,
      for example a college chatbot answering from college notices, or a company help-desk bot
      answering from company policies.
