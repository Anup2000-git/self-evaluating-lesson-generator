id: rag
title: Introduction to RAG (Retrieval-Augmented Generation)
version: "2026.10.1"
aliases:
  - rag
  - introduction to rag
  - intro to rag
  - rag basics
  - retrieval-augmented generation
  - retrieval augmented generation
  - rag retrieval-augmented generation
  - introduction to retrieval-augmented generation
summary: >-
  How an AI system first finds relevant information in a knowledge base and then uses it
  to write a grounded answer.

key_points:
  what: >-
    RAG (Retrieval-Augmented Generation) is a method where, before a large language model
    answers, the system retrieves relevant pieces of information from an outside knowledge
    source, adds them to the prompt together with the question, and the model generates its
    answer using that information.
  why:
    - "Knowledge cutoff: an LLM only knows what was in its training data up to a certain date, so on its own it does not know recent or updated information."
    - "Hallucination: an LLM can state false things that sound correct; giving it real, relevant text to answer from reduces this."
    - "Private or specific data: an LLM never saw an organisation's own documents (company policies, college notices, product manuals); RAG lets it use them without retraining."
    - "Trust: answers can show their sources, so people can check them."
    - "Cost and speed of updates: updating the documents in a knowledge base is much cheaper and faster than retraining or fine-tuning a model."
  how_steps:
    - "Prepare the knowledge: collect the documents and split them into small chunks."
    - "Index: turn each chunk into an embedding (and/or a keyword index) and store it, for example in a vector database."
    - "Retrieve: when a question arrives, find the chunks most relevant to the question (for example with similarity search)."
    - "Augment: add the retrieved chunks to the prompt together with the question and instructions."
    - "Generate: the LLM writes the answer using the retrieved chunks, ideally pointing to its sources."
  misconceptions:
    - "RAG retrains or permanently changes the model - false: the retrieved information is used only for that one answer; the model's weights do not change."
    - "RAG always gives correct answers - false: if the wrong chunks are retrieved or the documents are wrong, the answer can still be wrong."
    - "RAG is the same as fine-tuning - false: fine-tuning changes the model itself; RAG only adds information to the prompt."
    - "Retrieving more text is always better - false: irrelevant text can confuse the model and the context window is limited."
  limitations:
    - "Answer quality depends on retrieval quality: if the search brings the wrong chunk, the answer can be wrong."
    - "The knowledge base must be kept up to date, otherwise answers use old information."
    - "The context window limits how much retrieved text can be added to the prompt."
    - "The extra search step adds time and cost."
    - "The model can still hallucinate or ignore the retrieved text."

example_must_show:
  - the exact question the user asks
  - the specific piece(s) of information that are retrieved
  - how the retrieved information is added to the prompt
  - the final answer that uses the retrieved information

