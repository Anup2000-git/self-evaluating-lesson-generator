[project]
name = "lessongen-common"
version = "0.1.0"
description = "Shared contracts (schemas), LLM plumbing and service utilities for the lesson generator microservices."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "structlog>=25.4",
    "httpx>=0.28",
    "tenacity>=9.1",
    "pyyaml>=6.0.2",
    "redis>=6.2",
    "rapidfuzz>=3.13",
]

[project.optional-dependencies]
service = ["fastapi>=0.120", "uvicorn[standard]>=0.37"]
llm = ["langchain>=1.0", "langchain-core>=1.0", "langchain-openai>=1.0", "langgraph>=1.0", "jinja2>=3.1", "langfuse>=4.17"]
text = ["textstat>=0.7.10", "wordfreq>=3.1", "snowballstemmer>=2.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lessongen_common"]
