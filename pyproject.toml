[project]
name = "lessongen-workspace"
version = "0.1.0"
description = "Self-evaluating lesson generator - uv workspace root (not a package itself)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "fakeredis>=2.31",
    "aiosqlite>=0.21",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# E501: the formatter owns line length. RUF001-003: lessons legitimately contain Devanagari and
# typographic dashes. SIM905: """word list""".split() reads better than long list literals.
# ASYNC109: our `timeout` parameters are HTTP timeouts, not asyncio cancellation scopes.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM905", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = [
    "lessongen_common",
    "knowledge_svc",
    "memory_svc",
    "evaluator_svc",
    "generator_svc",
    "orchestrator_svc",
]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["libs/common/tests", "services/knowledge/tests", "services/memory/tests"]
